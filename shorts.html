<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AniTube Shorts - YouTube Style Shorts</title>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="shorts-page-body">
  <div class="app-container">
    
    <!-- DESKTOP SIDEBAR NAVIGATION -->
    <aside class="sidebar-nav">
      <div class="brand-logo">
        <i class="fa-solid fa-play"></i>
        <span>Ani<span>Tube</span></span>
      </div>

      <div class="nav-group">
        <span class="nav-group-title">Menu</span>
        <a href="index.html" class="nav-item">
          <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="shorts.html" class="nav-item active">
          <i class="fa-solid fa-bolt"></i> Shorts
        </a>
        <a href="watchlist.html" class="nav-item">
          <i class="fa-solid fa-bookmark"></i> Watchlist
        </a>
        <a href="downloads.html" class="nav-item">
          <i class="fa-solid fa-download"></i> Downloads
        </a>
        <a href="profile.html" class="nav-item">
          <i class="fa-solid fa-user"></i> Profile
        </a>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main-wrapper" style="overflow:hidden;">
      
      <!-- TOP HEADER BAR (CLEAN SHORTS HEADER WITH SEARCH & MUTE) -->
      <header class="top-header">
        <div class="mobile-brand">
          <i class="fa-solid fa-bolt" style="color:var(--accent-purple);"></i>
          <span>Shorts</span>
        </div>

        <div class="header-search-bar">
          <i class="fa-solid fa-magnifying-glass search-icon-left"></i>
          <input type="text" id="globalSearchInput" class="header-search-input" placeholder="Search anime shorts, clips...">
        </div>

        <div class="header-actions">
          <a href="search.html" class="icon-btn mobile-search-btn" title="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
          </a>
          <a href="profile.html" class="icon-btn" title="Notifications">
            <i class="fa-regular fa-bell"></i>
          </a>
        </div>
      </header>

      <!-- YOUTUBE SHORTS VERTICAL REEL VIEW -->
      <div class="shorts-reel-container" id="shortsReelContainer">
        
        <div class="short-card-vertical" id="shortCardActive">
          
          <!-- SHORT VIDEO BOX (VERTICAL FULL HEIGHT CARD) -->
          <div class="short-video-box" id="shortVideoBox">
            <video id="shortVideoElement" class="short-video-element" loop playsinline autoplay muted poster="https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=600&auto=format&fit=crop">
              <source src="https://assets.mixkit.co/videos/preview/mixkit-anime-character-in-a-futuristic-city-41556-large.mp4" type="video/mp4">
            </video>

            <!-- BOTTOM INFO OVERLAY INSIDE VIDEO CARD -->
            <div class="short-info-overlay">
              <div style="display:flex; align-items:center; gap:0.6rem; margin-bottom:0.25rem;">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=100&auto=format&fit=crop" style="width:32px; height:32px; border-radius:50%; border:2px solid #fff; object-fit:cover;" alt="Channel">
                <span style="font-weight:700; font-size:0.88rem;" id="shortChannelHandle">@anitube_official</span>
                <button style="padding:0.2rem 0.65rem; background:#fff; color:#000; font-weight:800; font-size:0.72rem; border-radius:var(--radius-full);">Subscribe</button>
              </div>

              <span class="short-anime-badge" id="shortAnimeBadge">
                <i class="fa-solid fa-tv"></i> <span id="shortAnimeName">Solo Leveling</span>
              </span>
              <h3 class="short-title-text" id="shortTitleText">Sung Jinwoo Leveling Up Epic Aura ⚡ #SoloLeveling</h3>
              
              <button class="btn-primary" style="padding:0.4rem 0.85rem; font-size:0.8rem; width:fit-content; margin-top:0.25rem;" onclick="playShow('solo-leveling')">
                <i class="fa-solid fa-play"></i> Watch Full Episode
              </button>
            </div>

            <!-- YOUTUBE RED BOTTOM PROGRESS BAR -->
            <div class="short-red-progress-bar">
              <div class="short-red-progress-fill" id="shortRedProgressFill"></div>
            </div>
          </div>

          <!-- RIGHT ACTION SIDEBAR (EXACT YOUTUBE HOLLOW ICON STYLE: LIKE, COMMENT, SHARE, SOUND) -->
          <div class="short-action-sidebar">
            <button class="short-action-btn" id="btnShortLike" title="Like">
              <div class="short-action-icon"><i class="fa-regular fa-heart"></i></div>
              <span id="txtShortLikes">245K</span>
            </button>
            
            <button class="short-action-btn" onclick="alert('Comments coming soon!')" title="Comment">
              <div class="short-action-icon"><i class="fa-regular fa-comment"></i></div>
              <span id="txtShortComments">1.8K</span>
            </button>

            <button class="short-action-btn" onclick="navigator.clipboard.writeText(location.href); alert('Short Link Copied!')" title="Share">
              <div class="short-action-icon"><i class="fa-solid fa-share"></i></div>
              <span>Share</span>
            </button>

            <button class="short-action-btn" id="btnMuteToggle" title="Toggle Sound">
              <div class="short-action-icon"><i class="fa-solid fa-volume-xmark"></i></div>
              <span id="txtMuteLabel">Muted</span>
            </button>
          </div>

        </div>

      </div>

    </main>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
      <a href="index.html" class="bottom-nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a href="shorts.html" class="bottom-nav-item active">
        <i class="fa-solid fa-bolt"></i>
        <span>Shorts</span>
      </a>
      <a href="watchlist.html" class="bottom-nav-item">
        <i class="fa-solid fa-bookmark"></i>
        <span>Watchlist</span>
      </a>
      <a href="downloads.html" class="bottom-nav-item">
        <i class="fa-solid fa-download"></i>
        <span>Downloads</span>
      </a>
      <a href="profile.html" class="bottom-nav-item">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>

  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let currentShortIdx = 0;
      let isAnimating = false;
      const shortsList = ANITUBE_DATA.shorts || [];

      const videoBox = document.getElementById('shortVideoBox');
      const video = document.getElementById('shortVideoElement');
      const titleEl = document.getElementById('shortTitleText');
      const animeNameEl = document.getElementById('shortAnimeName');
      const likesEl = document.getElementById('txtShortLikes');
      const commentsEl = document.getElementById('txtShortComments');
      const btnLike = document.getElementById('btnShortLike');
      const btnMute = document.getElementById('btnMuteToggle');
      const muteLabel = document.getElementById('txtMuteLabel');
      const reelContainer = document.getElementById('shortsReelContainer');
      const progressFill = document.getElementById('shortRedProgressFill');

      // Sync progress bar with video time
      if (video && progressFill) {
        video.ontimeupdate = () => {
          if (video.duration) {
            const pct = (video.currentTime / video.duration) * 100;
            progressFill.style.width = `${pct}%`;
          }
        };
      }

      function loadShort(idx, direction = 'next') {
        if (isAnimating) return;
        isAnimating = true;

        if (idx < 0) idx = shortsList.length - 1;
        if (idx >= shortsList.length) idx = 0;
        currentShortIdx = idx;

        const item = shortsList[currentShortIdx];
        if (!item || !videoBox) {
          isAnimating = false;
          return;
        }

        // Reset Like button state
        if (btnLike) {
          btnLike.classList.remove('liked');
          const icon = btnLike.querySelector('.short-action-icon i');
          if (icon) icon.className = 'fa-regular fa-heart';
        }

        // Apply Out & In Animations (Slide + Fade)
        const outAnim = direction === 'next' ? 'anim-slide-up-out' : 'anim-slide-down-out';
        const inAnim = direction === 'next' ? 'anim-slide-up-in' : 'anim-slide-down-in';

        videoBox.className = `short-video-box ${outAnim}`;

        setTimeout(() => {
          titleEl.textContent = item.title;
          animeNameEl.textContent = item.anime;
          likesEl.textContent = item.likes;
          commentsEl.textContent = item.comments;

          video.src = item.videoUrl;
          video.poster = item.posterUrl;
          video.play().catch(() => {});

          videoBox.className = `short-video-box ${inAnim}`;

          setTimeout(() => {
            videoBox.className = 'short-video-box';
            isAnimating = false;
          }, 380);
        }, 250);
      }

      // Like Button Toggle Handler (Hollow <-> Filled Heart Animation)
      if (btnLike) {
        let liked = false;
        btnLike.onclick = () => {
          liked = !liked;
          const icon = btnLike.querySelector('.short-action-icon i');
          if (liked) {
            btnLike.classList.add('liked');
            icon.className = 'fa-solid fa-heart';
          } else {
            btnLike.classList.remove('liked');
            icon.className = 'fa-regular fa-heart';
          }
        };
      }

      // Mute Toggle Handler
      if (btnMute && video) {
        btnMute.onclick = () => {
          video.muted = !video.muted;
          const icon = btnMute.querySelector('i');
          if (video.muted) {
            icon.className = 'fa-solid fa-volume-xmark';
            muteLabel.textContent = 'Muted';
          } else {
            icon.className = 'fa-solid fa-volume-high';
            muteLabel.textContent = 'Sound';
          }
        };
      }

      // MOBILE TOUCH SWIPE LISTENERS
      let touchStartY = 0;
      let touchEndY = 0;

      if (reelContainer) {
        reelContainer.addEventListener('touchstart', (e) => {
          touchStartY = e.touches[0].clientY;
        }, { passive: true });

        reelContainer.addEventListener('touchend', (e) => {
          if (isAnimating) return;
          touchEndY = e.changedTouches[0].clientY;
          const diffY = touchStartY - touchEndY;

          if (Math.abs(diffY) > 35) {
            if (diffY > 0) {
              loadShort(currentShortIdx + 1, 'next');
            } else {
              loadShort(currentShortIdx - 1, 'prev');
            }
          }
        }, { passive: true });
      }

      // Mouse Wheel Scroll Listener
      let wheelTimeout;
      window.addEventListener('wheel', (e) => {
        if (wheelTimeout || isAnimating) return;
        if (e.deltaY > 25) {
          loadShort(currentShortIdx + 1, 'next');
          wheelTimeout = setTimeout(() => wheelTimeout = null, 600);
        } else if (e.deltaY < -25) {
          loadShort(currentShortIdx - 1, 'prev');
          wheelTimeout = setTimeout(() => wheelTimeout = null, 600);
        }
      }, { passive: true });

      // Keyboard Arrow Keys
      window.addEventListener('keydown', (e) => {
        if (isAnimating) return;
        if (e.key === 'ArrowDown') {
          loadShort(currentShortIdx + 1, 'next');
        } else if (e.key === 'ArrowUp') {
          loadShort(currentShortIdx - 1, 'prev');
        }
      });

      // Initial Load
      const firstItem = shortsList[0];
      if (firstItem) {
        titleEl.textContent = firstItem.title;
        animeNameEl.textContent = firstItem.anime;
        likesEl.textContent = firstItem.likes;
        commentsEl.textContent = firstItem.comments;
        video.src = firstItem.videoUrl;
      }
    });
  </script>
</body>
</html>
